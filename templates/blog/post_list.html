<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<h1>Post List</h1>


{% if user.is_authenticated %}
     <a href="{% url 'blog:create_post' %}">Create Post</a>
{% else %}
    <a href="{% url 'login' %}">Tizimda Post Yaratish</a>
{% endif %}


{% for post in posts %}
    <a href="{% url 'post_detail' post.id %}">{{ post.title }}</a>
{% empty %}
    <p>No posts yet.</p>
{% endfor %}


</body>
</html>
